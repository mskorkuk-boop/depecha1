<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Депеша</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@600;800;900&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Roboto+Condensed:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap">
<style>
/* Layout: a strict broadsheet front page. Dateline + centred nameplate over a double rule, a sticky edition bar, rubric filter, lead story across the measure, then ruled columns beside a contents rail; below the fold, the coverage map, charts, calendar. */
:root{
  --paper:#fbfbf9; --ink:#141413; --ink2:#46453f; --muted:#75736b; --hair:#d5d3cb; --wash:#efeee9;
  --accent:#a3161c; --bar:#2a2a27; --bar2:#a3161c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --display:"Noto Serif Display","Literata",Georgia,"Noto Serif JP",serif;
  --body:"Literata",Georgia,"Noto Serif JP",serif;
  --label:"Roboto Condensed","Arial Narrow",Arial,"Noto Serif JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131312;--ink:#ecebe6;--ink2:#c4c2bb;--muted:#959389;--hair:#34332f;--wash:#1d1d1b;
  --accent:#ef6a62;--bar:#d9d7cf;--bar2:#ef6a62;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131312;--ink:#ecebe6;--ink2:#c4c2bb;--muted:#959389;--hair:#34332f;--wash:#1d1d1b;
  --accent:#ef6a62;--bar:#d9d7cf;--bar2:#ef6a62;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;color-scheme:dark}
:lang(ja){--display:"Noto Serif JP",serif;--body:"Noto Serif JP",serif}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{background:var(--paper);color:var(--ink);font:400 1.0625rem/1.58 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl,.kick,.dateline,.tabs button,.chips button,.src,.meta-row,.tool,.cal time,table.mx{font-family:var(--label)}

/* Masthead */
.mast{padding-block:18px 0;display:grid;gap:10px}
.dateline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--ink);padding-bottom:6px}
.nameplate{text-align:center;padding-block:6px 4px}
.nameplate h1{margin:0;font:900 clamp(2.9rem,11vw,6.6rem)/.95 var(--display);letter-spacing:-.02em;text-wrap:balance}
.nameplate p{margin:8px auto 0;max-width:62ch;color:var(--ink2);font-size:.95rem;font-style:italic}
.dbl{height:6px;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink)}

/* Sticky edition bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--ink)}
.bar .in{display:flex;align-items:center;gap:8px 16px;min-height:52px}
.tabs{display:flex;gap:2px;margin:0;padding:0;list-style:none;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:8px 10px;min-height:44px;font-size:.92rem;letter-spacing:.02em;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;color:var(--ink2)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tabs .code{display:none}
.tool{display:flex;align-items:center;gap:8px;flex:none}
.tool button,.tool select{border:1px solid var(--ink);background:var(--paper);min-height:38px;padding:4px 10px;font-size:.85rem;cursor:pointer;border-radius:0}
.tool button{display:inline-flex;align-items:center;gap:6px}
.tool button:hover{background:var(--ink);color:var(--paper)}
.tool select{max-width:44vw}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}

/* Rubric filter */
.filters{padding-block:14px 0;display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips button{border:1px solid var(--hair);background:none;padding:5px 11px;min-height:34px;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;color:var(--ink2)}
.chips button:hover{border-color:var(--ink);color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chips button span{opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}
.frame{margin:0;font-size:.9rem;color:var(--ink2);max-width:80ch}

/* Front page */
.page{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:0 36px;padding-block:18px 8px;align-items:start}
.main{min-width:0}
.rail{min-width:0;border-left:1px solid var(--hair);padding-left:24px;display:grid;gap:28px}
.lead{border-bottom:3px double var(--ink);padding-bottom:20px;margin-bottom:20px}
.cols{columns:2 300px;column-gap:36px;column-rule:1px solid var(--hair)}
article{break-inside:avoid;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--hair);display:grid;gap:7px;scroll-margin-top:84px}
.cols article:last-child{border-bottom:0}
.kick{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kick .rub{color:var(--accent);font-weight:700}
.kick .live{color:var(--accent)}
.kick .live::before{content:"● "}
article h3{margin:0;font:700 1.36rem/1.2 var(--display);text-wrap:balance}
.lead h3{font-size:clamp(1.85rem,4.6vw,3rem);font-weight:800;line-height:1.06;letter-spacing:-.01em}
.lead .sum{font-size:1.16rem;max-width:62ch}
.lead .sum::first-letter{float:left;font:800 3.4em/.8 var(--display);margin:.06em .08em 0 0;color:var(--accent)}
.sum{margin:0;max-width:66ch;hyphens:auto}
article.gap h3{font-size:1.1rem;color:var(--ink2);font-weight:600}
article.gap .sum{font-style:italic;color:var(--muted);font-size:.95rem}
.src{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:.8rem;color:var(--muted)}
.src a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:3px}
.src a:hover{text-decoration-color:var(--accent)}
.src time{margin-left:5px}
.meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:.8rem;color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dots i{width:10px;height:10px;border:1px solid var(--ink);display:inline-block}
.dots i.on{background:var(--ink)}
.linkbtn{border:0;background:none;padding:6px 0;min-height:32px;cursor:pointer;font:500 .8rem var(--label);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:color-mix(in oklab,var(--accent) 14%,transparent)}to{background:transparent}}

/* Rail */
.rail h2,.sec>h2{margin:0;font:700 .82rem var(--label);letter-spacing:.12em;text-transform:uppercase;border-top:3px solid var(--ink);padding-top:6px}
.toc{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:9px;counter-reset:t}
.toc li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;font-size:.92rem;line-height:1.3;counter-increment:t}
.toc li::before{content:counter(t);font:700 .8rem var(--label);color:var(--accent);padding-top:2px}
.toc a{color:var(--ink);text-decoration:none}
.toc a:hover{text-decoration:underline}
.toc .g{color:var(--muted)}
.cal{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.cal li{display:grid;grid-template-columns:66px minmax(0,1fr);gap:8px;font-size:.92rem;line-height:1.32}
.cal time{font-size:.8rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;padding-top:1px}

/* Below the fold */
.sec{padding-block:26px 6px;display:grid;gap:14px}
.sec>h2{font-size:.95rem}
.sec .note{margin:0;color:var(--ink2);font-size:.9rem;max-width:80ch}
.duo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.mapbox{display:grid;gap:10px;min-width:0}
.mapbox select{border:1px solid var(--ink);background:var(--paper);min-height:38px;padding:4px 8px;font:.9rem var(--label);max-width:100%;border-radius:0}
svg.map{width:100%;height:auto;display:block}
svg.map text{font:500 9px var(--label);pointer-events:none}
svg.map .sep{stroke:var(--hair);stroke-dasharray:3 3}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 14px;font:.8rem var(--label);color:var(--ink2);align-items:center}
.maplegend i{display:inline-block;width:12px;height:12px;border:1px solid var(--ink);vertical-align:-2px;margin-right:5px}
.scroll{overflow-x:auto;min-width:0}
table.mx{border-collapse:collapse;font-size:.85rem;width:100%;font-variant-numeric:tabular-nums}
table.mx th,table.mx td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--hair)}
table.mx thead th{font-weight:700;letter-spacing:.05em;border-bottom:1px solid var(--ink)}
table.mx th[scope=row]{text-align:left;font-weight:400;min-width:150px}
table.mx th[scope=row] button{border:0;background:none;padding:2px 0;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
table.mx tr.sel th[scope=row] button{font-weight:700;text-decoration:underline;text-decoration-color:var(--accent)}
table.mx td button{width:26px;height:26px;border:1px solid var(--ink);background:none;cursor:pointer;padding:0}
table.mx td button.on{background:var(--ink)}
table.mx td button.off{border-color:var(--hair);background:repeating-linear-gradient(45deg,transparent 0 3px,var(--hair) 3px 4px)}
table.mx tfoot td{font-weight:700;border-bottom:0}

#cov .duo{grid-template-columns:minmax(0,1fr)}
.lochead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.trbtn{margin-left:auto;border:1px solid var(--ink);background:var(--paper);min-height:36px;padding:4px 12px;cursor:pointer;font:500 .85rem var(--label);letter-spacing:.03em}
.trbtn:hover,.trbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lochead h3{margin:0;font:800 1.6rem/1.1 var(--display)}
.cols.loc{columns:3 260px}
.cols.loc article h3{font-size:1.15rem}
.cols.loc .sum{font-size:.98rem}
.tool .tx{white-space:nowrap}
.tool button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
body.compact .sum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.compact .lead .sum::first-letter{float:none;font:inherit;color:inherit;margin:0}
body.compact .main .src,body.compact .diff{display:none}
.brief{border:1px solid var(--ink);padding:12px 16px;margin-bottom:20px;display:grid;gap:8px}
.brief h2{margin:0;font:700 .8rem var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brief ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.brief li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:.95rem;line-height:1.4}
.brief li b{font:700 .72rem/1.9 var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.brief a{color:var(--ink);text-decoration:none}.brief a:hover{text-decoration:underline}
.diff{margin:0;font-size:.9rem;line-height:1.45;color:var(--ink2);border-left:2px solid var(--accent);padding-left:10px;max-width:66ch}
.diff b{font:700 .74rem var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.qb{font:500 .7rem/1.6 var(--label);letter-spacing:.04em;text-transform:uppercase;border:1px dashed var(--muted);padding:0 6px;color:var(--muted)}
.star{border:0;background:none;cursor:pointer;color:var(--muted);min-width:32px;min-height:32px;padding:0;display:inline-grid;place-items:center}
.star svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.star[aria-pressed="true"]{color:var(--accent)}.star[aria-pressed="true"] svg{fill:currentColor}
.ilist{list-style:none;margin:0;padding:0;display:grid}
.ilist li{border-bottom:1px solid var(--hair)}
.ilist button.go{display:grid;gap:3px;width:100%;text-align:left;border:0;background:none;padding:10px 2px;cursor:pointer}
.ilist button.go:hover h3{text-decoration:underline}
.ilist h3{margin:0;font:700 1.02rem/1.25 var(--display)}
.ilist p{margin:0;font-size:.9rem;color:var(--ink2)}
.wk{display:grid;gap:4px;padding-block:14px;border-bottom:1px solid var(--hair)}
.wk h3{margin:0;font:800 1.2rem/1.2 var(--display)}
.wk .ilist li{border:0}.wk .ilist button.go{padding:4px 0;grid-template-columns:70px minmax(0,1fr);gap:10px}
.wk time{font:700 .8rem var(--label);color:var(--accent);padding-top:2px}
table.heat td{font-variant-numeric:tabular-nums;font-size:.82rem;min-width:44px}
/* Charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:26px 36px}
figure{margin:0;display:grid;gap:10px;align-content:start;border-top:1px solid var(--ink);padding-top:10px;min-width:0}
figcaption{font:700 1.15rem/1.25 var(--display);text-wrap:balance}
figure .note{font-size:.84rem}
.chart{display:grid;gap:7px;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:minmax(84px,150px) minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:.88rem}
.row .lb{min-width:0;overflow-wrap:anywhere;font-family:var(--label)}
.track{height:16px;position:relative;border-left:1px solid var(--muted)}
.fill{position:absolute;top:0;bottom:0;left:0;background:var(--bar);border-radius:0 3px 3px 0}
.row.b .fill{background:var(--bar2)}
.val{font:500 .84rem var(--label);text-align:right}
.div .track{border-left:0;background:linear-gradient(var(--muted),var(--muted)) center/1px 100% no-repeat}
.div .fill.neg{border-radius:3px 0 0 3px;background:var(--bar2)}
.share{display:flex;gap:2px;height:28px}
.share span{display:block;min-width:2px}
.share span:first-child{border-radius:3px 0 0 3px}.share span:last-child{border-radius:0 3px 3px 0}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:5px;font:.85rem var(--label)}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center}
.legend i{width:12px;height:12px;border-radius:2px;display:block}
.legend b{font-weight:500;font-variant-numeric:tabular-nums}
.lc{position:relative}
.lc svg{width:100%;height:auto;display:block;overflow:visible}
.lc text{font:400 11px var(--label);fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--paper);border:1px solid var(--ink);padding:6px 8px;font:.8rem/1.35 var(--label);min-width:120px;transform:translate(-50%,-100%);white-space:nowrap}
.tip i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:5px}

/* Calendar section */
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:0;background:none;padding:6px 14px;min-height:36px;cursor:pointer;font:.85rem var(--label);letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.calhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.wknav{display:flex;align-items:center;gap:8px;font:.9rem var(--label)}
.wknav button{border:1px solid var(--ink);background:none;width:36px;height:36px;cursor:pointer}
.wknav button:disabled{opacity:.35;cursor:default}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--hair)}
.day{border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);min-height:132px;padding:6px 7px;display:grid;align-content:start;gap:6px;min-width:0}
.day h4{margin:0;font:500 .78rem var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.day h4 b{font:800 1.3rem/1 var(--display);color:var(--ink)}
.day.today h4 b{color:var(--accent)}
.day.we{background:var(--wash)}
.ev{font-size:.84rem;line-height:1.28;border-left:3px solid var(--accent);padding-left:6px;overflow-wrap:anywhere}
.ev.cont{border-left-style:dotted;color:var(--ink2)}
.empty{color:var(--muted);font-style:italic;font-size:.92rem;margin:0}
.calfull{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:0 28px}
.calfull li{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;padding-block:9px;border-bottom:1px solid var(--hair)}
.calfull time{font:700 .85rem var(--label);color:var(--accent)}

footer{padding-block:24px 48px;margin-top:20px;border-top:3px double var(--ink);font-size:.85rem;color:var(--muted)}
.state{color:var(--muted);padding-block:40px}

/* Dialogs */
dialog{border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:0;width:min(1120px,calc(100vw - 24px));max-height:calc(100vh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:rgba(10,10,10,.45)}
.dlg{display:grid;grid-template-rows:auto minmax(0,1fr);max-height:inherit}
.dhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 18px;border-bottom:3px double var(--ink)}
.dhead h2{margin:0;font:800 1.45rem/1.15 var(--display);text-wrap:balance}
.dhead .kick{margin-bottom:4px}
.x{border:1px solid var(--ink);background:none;min-width:38px;height:38px;cursor:pointer;font:1.1rem var(--label);flex:none}
.dbody{overflow:auto;padding:16px 18px 22px}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:0 28px}
.cmp section{padding-block:12px;border-bottom:1px solid var(--hair);display:grid;gap:6px;align-content:start;min-width:0}
.cmp .ln{font:700 .78rem var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.cmp h3{margin:0;font:700 1.08rem/1.25 var(--display)}
.cmp p{margin:0;font-size:.95rem}
.cmp .gap p{color:var(--muted);font-style:italic}
.sbox{display:grid;gap:10px}
.sbox input[type=search]{width:100%;border:0;border-bottom:2px solid var(--ink);background:none;padding:8px 2px;font:600 1.3rem var(--body);border-radius:0}
.sbox input[type=search]::placeholder{color:var(--muted);font-weight:400}
.sres{list-style:none;margin:0;padding:0;display:grid}
.sres li button{display:grid;gap:3px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);background:none;padding:10px 2px;cursor:pointer}
.sres li button:hover h3{text-decoration:underline}
.sres h3{margin:0;font:700 1.02rem/1.25 var(--display)}
.sres p{margin:0;font-size:.88rem;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.count{font:.85rem var(--label);color:var(--muted)}

@media (max-width:1240px){.tool .tx{display:none}.tool button{padding:4px 9px}}
@media (max-width:900px){.page{grid-template-columns:minmax(0,1fr)}.rail{border-left:0;padding-left:0;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:24px 32px}.duo{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .bar .in{flex-wrap:wrap;gap:0 8px;padding-bottom:6px}
  .tabs{flex:1 1 100%;display:grid;grid-template-columns:repeat(8,minmax(0,1fr))}
  .tabs .full{display:none}.tabs .code{display:inline}.tabs button{padding:8px 0;width:100%}
  .tool{flex:1 1 100%;min-width:0}.tool .tx{display:none}.tool select{flex:1 1 auto;max-width:none;min-width:0;width:0}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px)}article{scroll-margin-top:112px}
  .dateline{justify-content:center;text-align:center}

/* Calendar */

  const u=UI[lang];const ev=(i.calendar||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));const v=$("calView");v.replaceChildren();
  const nav=$("wknav");nav.hidden=calMode!=="week"||!ev.length;
  if(!ev.length){v.append(el("p","empty",u.wNone));return}
  if(calMode==="list"){const ol=el("ol","calfull");for(const e of ev){const li=el("li");const tm=el("time",null,rng(e));tm.dateTime=e.date;li.append(tm,el("span",null,lab(e.t)));ol.append(li)}v.append(ol);return}
  const first=monday(ev[0].date),last=monday(ev[ev.length-1].end||ev[ev.length-1].date);
  if(!wkStart||wkStart<first||wkStart>last)wkStart=monday(ev.find(e=>(e.end||e.date)>=i.date)?.date||ev[0].date);
  $("wprev").disabled=wkStart<=first;$("wnext").disabled=wkStart>=last;
  $("wlabel").textContent=fmt(wkStart,{day:"numeric",month:"short"})+" – "+fmt(addDays(wkStart,6),{day:"numeric",month:"short",year:"numeric"});
  const wk=el("div","week");let any=false;
  for(let d=0;d<7;d++){const day=addDays(wkStart,d);const box=el("div","day"+(d>4?" we":"")+(day===i.date?" today":""));
    const h=el("h4");h.append(el("span",null,fmt(day,{weekday:"short"})),el("b",null,fmt(day,{day:"numeric"})));box.append(h);
    const list=el("div");list.style.display="grid";list.style.gap="6px";
    for(const e of ev){const end=e.end||e.date;if(day<e.date||day>end)continue;any=true;const it=el("div","ev"+(day>e.date?" cont":""),lab(e.t));if(e.end)it.title=rng(e);list.append(it)}
    if(!list.childNodes.length)list.append(el("span","empty","—"));box.append(list);wk.append(box)}
  v.append(wk);if(!any)v.append(el("p","empty",u.wNone))}
function rng(e){if(!e.end)return fmt(e.date,{day:"numeric",month:"short"});return (e.date.slice(5,7)===e.end.slice(5,7)?fmt(e.date,{day:"numeric"}):fmt(e.date,{day:"numeric",month:"short"}))+"–"+fmt(e.end,{day:"numeric",month:"short"})}
$("wprev").onclick=()=>{wkStart=addDays(wkStart,-7);calDraw(cache[date])};
$("wnext").onclick=()=>{wkStart=addDays(wkStart,7);calDraw(cache[date])};
for(const b of $("calMode").children)b.onclick=()=>{calMode=b.dataset.m;ls.set("calMode",calMode);chrome();calDraw(cache[date])};

/* Derived charts from the archive */
async function loadArchive(){if(archive)return archive;const ds=(index?.issues||[]).slice(0,90);await Promise.all(ds.map(x=>load(x.date).catch(()=>null)));archive=ds.filter(x=>cache[x.date]).map(x=>({date:x.date,number:x.number,i:cache[x.date]}));return archive}
function derived(i,box){
  const u=UI[lang];const st=sorted(i);const n=st.length;
  box.append(barsChart({kind:"bars",split:99,unit:"n",title:u.covC,note:tpl(u.covCN,n),rows:LK.map(k=>[LANGS[k],st.filter(s=>s.t[k]).length])}));
  if(archive&&archive.length>1){const a=archive.slice().sort((x,y)=>x.date.localeCompare(y.date));
    box.append(lineChart({kind:"line",unit:"n",title:u.trC,note:u.trCN,x:a.map(x=>fmt(x.date,{day:"numeric",month:"short"})),series:[{name:u.tr1,values:a.map(x=>(x.i.stories||[]).length)},{name:u.tr2,values:a.map(x=>(x.i.stories||[]).reduce((g,s)=>g+LK.filter(k=>!s.t[k]).length,0))}]}))}}
function chartsDraw(i){const box=$("charts");box.replaceChildren();const show=!rubSel.size||rubSel.has("infographic");if(show)for(const c of i.charts||[])box.append(chart(c));derived(i,box)}

/* Search */
const norm=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
let sTimer;
async function runSearch(){
  const u=UI[lang];const q=norm($("q").value.trim());const out=$("sres");out.replaceChildren();
  if(q.length<2){$("scount").textContent=u.sHint;return}
  if(!archive){$("scount").textContent=u.sLoad;await loadArchive()}
  const terms=q.split(/\s+/);const res=[];
  for(const a of archive.slice().sort((x,y)=>y.date.localeCompare(x.date)))for(const s of a.i.stories||[])for(const k of (scope==="lang"?[lang]:[lang,...LK.filter(x=>x!==lang)])){const c=s.t[k];if(!c)continue;
    const hay=norm([c.h,c.s,s.event[k],(c.src||[]).map(x=>x.n).join(" ")].join(" "));if(terms.every(t=>hay.includes(t))){res.push({a,s,k,c});if(scope==="all")break}}
  for(const a of archive)for(const k of (scope==="lang"?[lang]:LK))for(const it of ((a.i.local||{})[k]||[])){const hay=norm([it.h,it.s,(it.src||[]).map(x=>x.n).join(" ")].join(" "));if(terms.every(t=>hay.includes(t)))res.push({a,s:{id:it.id,rubric:it.rubric,loc:k},k,c:it})}
  res.sort((x,y)=>y.a.date.localeCompare(x.a.date));
  $("scount").textContent=res.length?tpl(u.sFound,res.length):u.sNone;
  for(const r of res.slice(0,80)){const li=el("li"),b=el("button");b.type="button";
    const k=el("div","kick");k.append(el("span",null,fmt(r.a.date,{day:"numeric",month:"short",year:"numeric"})),el("span","rub",u.r[r.s.rubric]||r.s.rubric));if(r.k!==lang)k.append(el("span",null,LANGS[r.k]));
    const h=el("h3",null,r.c.h),p=el("p",null,r.c.s);h.lang=p.lang=r.k;b.append(k,h,p);
    b.onclick=async()=>{$("srchD").close();if(r.k!==lang){lang=r.k;ls.set("lang",lang)}rubSel.clear();if(r.s.loc)locSel=r.s.loc;await go(r.a.date);setHash();const t=$(r.s.loc?"l-"+r.s.loc+"-"+r.s.id:"s-"+r.s.id);if(t){t.scrollIntoView({behavior:reduce()?"auto":"smooth",block:"start"});t.classList.remove("flash");void t.offsetWidth;t.classList.add("flash")}};
    li.append(b);out.append(li)}}
$("q").addEventListener("input",()=>{clearTimeout(sTimer);sTimer=setTimeout(runSearch,160)});
for(const b of $("scope").children)b.onclick=()=>{scope=b.dataset.s;chrome();runSearch()};
$("wbtn").onclick=()=>openWeek();$("fbtn").onclick=()=>openFavs();
if(ls.get("compact")==="1")document.body.classList.add("compact");
$("cbtn").onclick=()=>{const v=document.body.classList.toggle("compact");ls.set("compact",v?"1":"0");$("cbtn").setAttribute("aria-pressed",v)};
$("sbtn").onclick=()=>{const d=$("srchD");try{d.showModal()}catch(e){d.setAttribute("open","")}$("q").focus();runSearch()};

/* Issue */
function issue(d){
  const i=cache[d];const u=UI[lang];
  $("edition").textContent=u.ed+" · "+u.no+i.number;
  $("dl").textContent=fmt(d,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const st=sorted(i);
  const nav=$("rubs");nav.replaceChildren();nav.setAttribute("aria-label",u.all);
  const allLi=el("li"),allB=el("button",null,u.all);allB.type="button";allB.setAttribute("aria-pressed",!rubSel.size);allB.onclick=()=>{rubSel.clear();draw()};allLi.append(allB);nav.append(allLi);
  for(const r of ORDER){const n=r==="infographic"?(i.charts||[]).length:st.filter(s=>s.rubric===r).length+((i.local||{})[lang]||[]).filter(s=>s.rubric===r).length;if(!n)continue;
    const li=el("li"),b=el("button",null,u.r[r]);b.type="button";b.append(el("span",null,String(n)));b.setAttribute("aria-pressed",rubSel.has(r));
    b.onclick=()=>{rubSel.has(r)?rubSel.delete(r):rubSel.add(r);draw()};li.append(b);nav.append(li)}
  const box=$("stories");box.replaceChildren();const vis=st.filter(visible);
  if(!vis.length){box.append(el("p","state",rubSel.size===1&&rubSel.has("infographic")?"":u.none))}
  else{const bl=vis.filter(s=>s.t[lang]).slice(0,5);if(bl.length>2){const bx=el("section","brief");bx.append(el("h2",null,u.brief));const ol=el("ol");
      for(const s of bl){const li=el("li"),a=el("a");a.href="#s-"+s.id;const txt=s.t[lang].s;const m=/^[\s\S]*?[.!?。…](?=[\s»”"」)]|$)/.exec(txt);a.textContent=m?m[0]:txt;a.lang=lang;a.onclick=e=>{e.preventDefault();const t=$("s-"+s.id);t.scrollIntoView({behavior:reduce()?"auto":"smooth"});t.classList.remove("flash");void t.offsetWidth;t.classList.add("flash")};li.append(el("b",null,u.r[s.rubric]),a);ol.append(li)}
      bx.append(ol);box.append(bx)}
    box.append(story(vis[0],u,true));const cols=el("div","cols");for(const s of vis.slice(1))cols.append(story(s,u,false));box.append(cols)}
  const toc=$("toc");toc.replaceChildren();
  for(const s of vis){const li=el("li"),a=el("a",s.t[lang]?null:"g",s.t[lang]?s.t[lang].h:(s.event[lang]||s.id));a.href="#s-"+s.id;a.onclick=e=>{e.preventDefault();const t=$("s-"+s.id);t.scrollIntoView({behavior:reduce()?"auto":"smooth"});t.classList.remove("flash");void t.offsetWidth;t.classList.add("flash")};li.append(a);toc.append(li)}
  const up=$("up");up.replaceChildren();const cal=(i.calendar||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));$("upBox").hidden=!cal.length;
  for(const e of cal.slice(0,5)){const li=el("li"),tm=el("time",null,rng(e));tm.dateTime=e.date;li.append(tm,el("span",null,lab(e.t)));up.append(li)}
  localDraw(i);coverage(i);chartsDraw(i);trends();calDraw(i)}
function localDraw(i){
  const u=UI[lang];const L=i.local||{};$("locSec").hidden=!Object.keys(L).length;if($("locSec").hidden)return;
  $("locH").textContent=u.loc;$("locNote").textContent=u.locN;
  let names;try{names=new Intl.DisplayNames([lang],{type:"region"})}catch(e){names={of:c=>c}}
  if(!locSel||!LANGS[locSel])locSel=lang;
  const tabs=$("ctabs");tabs.replaceChildren();
  for(const k of LK){const li=el("li"),b=el("button",null,names.of(COUNTRY[k]));b.type="button";b.setAttribute("aria-pressed",k===locSel);b.append(el("span",null,String((L[k]||[]).length)));b.onclick=()=>{locSel=k;localDraw(i)};li.append(b);tabs.append(li)}
  $("locC").textContent=names.of(COUNTRY[locSel]);$("locBy").textContent=LANGS[locSel]+" · "+u.locBy;
  const canTr=locSel!=="ru"&&(L[locSel]||[]).some(x=>x.tr&&x.tr.ru);const useTr=canTr&&locTr;const tb=$("trBtn");tb.hidden=!canTr;$("trNote").hidden=!useTr;$("trNote").textContent=u.trN;
  tb.textContent=useTr?u.trOff:u.trOn;tb.setAttribute("aria-pressed",useTr);tb.onclick=()=>{locTr=!useTr;ls.set("locTr",locTr?"1":"0");localDraw(i)};
  const box=$("loc");box.replaceChildren();const items=(L[locSel]||[]).filter(visible).slice().sort((a,b)=>ORDER.indexOf(a.rubric)-ORDER.indexOf(b.rubric));
  if(!items.length){box.append(el("p","empty",(L[locSel]||[]).length?u.none:u.locNone));return}
  for(const it of items){const a=el("article");a.id="l-"+locSel+"-"+it.id;const k=el("div","kick");k.append(el("span","rub",u.r[it.rubric]||it.rubric));if(it.developing)k.append(el("span","live",u.live));
    const tr=useTr&&it.tr&&it.tr.ru;const h=el("h3",null,tr?tr.h:it.h),p=el("p","sum",tr?tr.s:it.s);h.lang=p.lang=tr?"ru":locSel;if(tr)h.title=it.h;a.append(k,h,p,sources(it.src));
    const m=el("div","meta-row");if(tr){const b=el("span","qb",u.trB);b.title=it.h;m.append(b)}for(const b of qBadges(it.q))m.append(b);m.append(starBtn({d:date,id:it.id,loc:locSel}));a.append(m);box.append(a)}}
function message(t){$("stories").replaceChildren(el("p","state",t))}
async function load(d){if(!cache[d]){const r=await fetch("issues/"+d+".json",{cache:"no-cache"});if(!r.ok)throw 0;cache[d]=await r.json()}}
function draw(){chrome();if(date&&cache[date])issue(date)}
async function go(d){if(d!==date){wkStart=null;evSel=""}date=d;chrome();if(!cache[d])message(UI[lang].load);try{await load(d);draw()}catch(e){message(UI[lang].err)}}
$("issue").onchange=e=>{go(e.target.value).then(setHash)};
addEventListener("hashchange",()=>{const h=fromHash();if(h.l)lang=h.l;go(h.d||(index&&index.latest)||date)});
(async()=>{lang=pick();chrome();message(UI[lang].load);
  try{const r=await fetch("issues/index.json",{cache:"no-cache"});if(!r.ok)throw 0;index=await r.json();index.issues.sort((a,b)=>b.date.localeCompare(a.date));
    const h=fromHash();await go(h.d&&index.issues.some(i=>i.date===h.d)?h.d:index.latest);
    await loadArchive();if(cache[date])draw()}
  catch(e){message(UI[lang].err)}
})();
</script>
